[project]
name = "labspace-backend"
version = "1.0.0"
description = "D509 工作台后端（FastAPI + PostgreSQL + Casdoor OIDC）"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.15.1",
  "psycopg2-binary==2.9.12",
  "python-multipart==0.0.33",
  "python-docx==1.2.0",
  "openpyxl==3.1.5",
  "python-pptx==1.0.2",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
]

[tool.pnpm.python]
groups = ["dev"]

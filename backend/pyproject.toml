[project]
name = "labspace-backend"
version = "1.0.0"
description = "D509 工作台后端（FastAPI + PostgreSQL + Portal OIDC）"
requires-python = ">=3.15"
dependencies = [
  "fastapi==0.163.1",
  "uvicorn[standard]==0.54.0",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.15.1",
  "psycopg2-binary==2.9.13",
  "python-multipart==0.0.34",
  "python-docx==1.2.0",
  "openpyxl==3.1.5",
  "python-pptx==1.0.2",
  # 标准库 crypt 自 Python 3.13 移除，口令哈希改用 bcrypt（$2b$ 与既有数据兼容）
  "bcrypt==5.0.0",
]

[project.optional-dependencies]
# 生信依赖单独成组：它们会带进 numpy/scipy/pandas/matplotlib/h5py，
# 而 Python 3.15 上这些没有 manylinux 轮子、必须源码编译。放进主依赖会让
# 门户后端镜像白白胖 +1.1 GB，也会把编译工具链拖进运行时镜像。
# 因此拆成 lab/labspace-biotools 独立镜像（见 backend/Dockerfile 的 biotools target），
# 门户后端只做反向代理。
biotools = [
  "biopython==1.88",
  "scikit-bio==0.7.4",
  "dna-features-viewer==3.1.5",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
]

[tool.pnpm.python]
groups = ["dev"]


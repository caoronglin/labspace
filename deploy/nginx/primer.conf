# D509 引物设计平台（Primer3 工作台）—— 门户会话鉴权的反向代理
#
# 背景：primitive 应用本身**没有任何鉴权**（官方声明是单用户、只监听 127.0.0.1）。
# 因此这里不允许它直接对外：
#   1. 容器只绑 127.0.0.1:18097；
#   2. 对外只开 8097，并且每个请求先过 auth_request 问门户后端「有没有有效会话」；
#   3. 未登录直接 401，不把应用页面漏出去。
#
# 依赖：门户后端 GET /api/auth/check（有效 204 / 无效 401）。

server {
    listen 8097;
    server_name _;

    # 大文件与长时间任务：引物设计要上传 FASTA/质粒，批量任务可能跑几分钟
    client_max_body_size 512m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location = /_portal_auth {
        internal;
        proxy_pass http://127.0.0.1:8088/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        # 与 labspace.conf 的 /_portal_auth 保持同一口径：
        # 没有原始方法就分不清读写（GET 不该要 CSRF），没有 CSRF 头就挡不住跨站写。
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_set_header Cookie $http_cookie;
    }

    # 未登录时不要甩一个裸 401：带回去登录页，登录完直接回到这里。
    error_page 401 = @portal_login;
    location @portal_login {
        # 跳到**门户**（80 端口）的登录页，登录完再按 back 回到 8097。
        #
        # 为什么不能跳回 8097 自己（这是原来的写法，会死循环）：
        #   8097 的 auth_request 同样会拒掉 /api/auth/login（用户还没登录），
        #   error_page 又把它送回 @portal_login → 永远转不出去，
        #   浏览器直接报「重定向次数过多」。门户的登录接口在 80 端口的后端上。
        # back 里带上本服务的端口，登录完才能回到 8097 而不是停在门户首页。
        set $portal_base "$scheme://$host";
        set $primer_back "$scheme://$host:8097/";
        # 跳门户**登录页**（自建统一认证：账号+口令直连），不再走 Casdoor 的
        # /api/auth/login —— 那个端点只是 OIDC 发起端，会把人带到 Casdoor。
        return 302 $portal_base/login?back=$primer_back;
    }

    # 门户的登录/登出/回调走 80 端口的后端（8088）。
    # primer 自己的 API 是 /api/v1/*，不会跟这一段撞。
    #
    # 必须绕开 auth_request：否则未登录时这里同样 401 → error_page →
    # @portal_login → 又转回 /api/auth/login → 死循环（就是上面那个坑）。
    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        auth_request /_portal_auth;
        proxy_pass http://127.0.0.1:18097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
# D509 科研助手（AgentScope 2.0.11 官方 Agent Service）
#
# 安全边界：
#   * AgentScope 服务只绑 127.0.0.1:8100，外部无法直连；
#   * 每个请求先过 auth_request 问门户后端「有没有有效会话」；
#   * 门户返回的 X-Auth-User 由 nginx 注入成 X-User-ID —— **覆盖**客户端自带的
#     同名头，所以伪造 X-User-ID 无效（这是 AgentScope 默认身份依赖的落点）。

server {
    listen 8104;
    server_name _;

    client_max_body_size 64m;
    # SSE：不能缓冲，读超时要长
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location = /_portal_auth {
        internal;
        proxy_pass http://127.0.0.1:8088/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # SSE 客户端不跟随 302，因此这里保持 401（由前端处理），
    # 只对普通页面请求做登录跳转。
    error_page 401 = @portal_login;
    location @portal_login {
        # 必须带 $scheme://$host（不含本端口）：相对路径会被 nginx 再代理回
        # 本服务，登录页就成了 404。$host 不含端口，正好落到门户 80。
        return 302 $scheme://$host/api/auth/login?back=/;
    }

    location / {
        auth_request /_portal_auth;
        auth_request_set $auth_user $upstream_http_x_auth_user;

        proxy_pass http://127.0.0.1:8103;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 身份以门户会话为准：无条件覆盖，客户端传什么都会被替换掉
        proxy_set_header X-User-ID $auth_user;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

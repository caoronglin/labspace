# D509 Stirling PDF —— 自托管 PDF 工具箱
#
# 定位：论文 PDF 的合并/拆分/加水印/压缩/转换，全部在实验室自己的机器上做，
#       文件不出内网（不调用任何第三方 OCR / 转换 API）。
#
# 安全边界（与 primer 同构）：
#   1. 容器只绑 127.0.0.1:8106；对外只有这个 server。
#   2. 每个请求先 auth_request 问门户后端「有没有有效会话」。
#   3. 未登录 → 302 回门户登录页，登录完按 back 回到这里。
#
# 资源限制的两头：
#   - 应用侧：SYSTEM_EXECUTORPROCESSLIMIT / SYSTEM_FILELIMIT / SYSTEM_MAXFILESIZE
#     （compose.yaml）—— 它每个任务会拉起 LibreOffice 等子进程，不限并发就会
#     把整台机器吃光。
#   - 代理侧：上传体积上限 + 处理超时，与应用侧的 SYSTEM_TIMEOUT 对齐。

server {
    listen 8106;
    server_name _;

    client_max_body_size 256m;
    # 单次转换可能要跑一两分钟（LibreOffice），比一般请求长
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location = /_portal_auth {
        internal;
        proxy_pass http://127.0.0.1:8088/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    error_page 401 = @portal_login;
    location @portal_login {
        set $portal_base "$scheme://$host";
        set $stirling_back "$scheme://$host:8106/";
        return 302 $portal_base/api/auth/login?back=$stirling_back;
    }

    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查不鉴权（给监控用）
    location = /actuator/health {
        proxy_pass http://127.0.0.1:8116/actuator/health;
    }

    location / {
        auth_request /_portal_auth;

        proxy_pass http://127.0.0.1:8116;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# D509 WebSSH —— 浏览器里的 SSH/SFTP 工作台
#
# 定位：让实验室成员在手机/笔记本上直接操作内网的 HPC 与桌面，
#       不需要 SSH 客户端，也不需要把内网机器暴露到公网。
#
# 安全边界（三层，缺一层就等于把内网敞开）：
#   1. 应用容器只绑 127.0.0.1:8105；对外只有这个 server。
#   2. 每个请求先 auth_request 问门户后端「有没有有效会话」
#      （GET /api/auth/check，有效 204 / 无效 401）。
#      未登录 → 302 回门户登录页，登录完按 back 回到这里。
#   3. 应用自己的 SSH 目标白名单只放行实验室的 HPC 与桌面，
#      连不到别的网段 —— 防"拿它当跳板扫内网"。
#
# 资源限制在应用侧（配额/限流，见 compose.yaml），这里负责
# 连接层面的：WebSocket 不缓冲、长连接超时、单机连接数。

server {
    listen 8105;
    server_name _;

    # 终端是长连接 + 可能上传/下载文件
    client_max_body_size 512m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location = /_portal_auth {
        internal;
        proxy_pass http://127.0.0.1:8088/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    # 未登录 → 回门户登录页（不能跳回 8105 自己，否则会死循环）
    error_page 401 = @portal_login;
    location @portal_login {
        set $portal_base "$scheme://$host";
        set $webssh_back "$scheme://$host:8105/";
        return 302 $portal_base/api/auth/login?back=$webssh_back;
    }

    # 门户的登录/登出/回调走 80 端口的后端；必须绕开 auth_request，
    # 否则未登录时这里 401 → error_page → 又转回 /api/auth/login → 死循环。
    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查不鉴权（给监控用；只暴露 ready 状态，不泄露任何信息）
    location = /ready {
        proxy_pass http://127.0.0.1:8115/ready;
    }

    location / {
        auth_request /_portal_auth;

        proxy_pass http://127.0.0.1:8115;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（终端流）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
    }
}

# =====================================================================
#  LabSpace 内网入口（全部为 192.0.2.10 + 端口，不使用任何域名）
#
#    :80    门户            http://192.0.2.10/
#    :8090  统一认证 Casdoor http://192.0.2.10:8090/
#    :8080  Quantum 文件    http://192.0.2.10:8080/files/  （容器直接发布）
#    :8092  文件工坊        http://192.0.2.10:8092/
#    :8102  生信实训平台    http://192.0.2.10:8102/
#    :8082  draw.io 绘图    http://192.0.2.10:8082/        （容器直接发布）
#    :8086  Linux 命令速查  http://192.0.2.10:8086/
#    :8091  JBrowse 2       http://192.0.2.10:8091/
# =====================================================================

# WebSocket / SSE 升级
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 大文件上传（课程资料与生信数据）
client_max_body_size 10G;

# ---------------------------------------------------------------- 限流（内网基础防护）
# 说明：zone 只是定义，必须在 location 里用 limit_req 才会真正生效。
# 之前只定义了 zone 却没挂 limit_req，等于没有限流；现在按用途分别挂载。
limit_req_zone $binary_remote_addr zone=lab_api:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=lab_login:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=lab_conn:10m;

upstream labspace_backend   { server 127.0.0.1:8088; keepalive 16; }
upstream lab_casdoor        { server 127.0.0.1:8000; keepalive 8; }
upstream labgo              { server 127.0.0.1:8122; keepalive 8; }
# 服务目录 / 语料 / 搜索：Go 核心为主，Python 后端作为 backup 兼顶
# （Python 侧同时提供 /v1/* 同路径别名，见 backend/app/main.py）
upstream labgo_fallback     { server 127.0.0.1:8122 max_fails=1 fail_timeout=10s; server 127.0.0.1:8088 backup; }

# ---------------------------------------------------------------- 通用反代参数
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

# =====================================================================
#  门户（默认站点：未匹配到主机名时也进入门户，方便用 IP 直连）
# =====================================================================
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    root /opt/labspace/frontend/dist;
    index index.html;

    # 静态文件元数据缓存，减少高频访问时的 stat/open 开销
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 前端入口 HTML 不缓存（发布后立即生效）
    location = /index.html {
        include /opt/labspace/deploy/nginx/lab-security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    # 前端静态资源（文件名带 hash，可长期缓存；避免与 expires 叠加出两条头）
    location /assets/ {
        include /opt/labspace/deploy/nginx/lab-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # 后端 API（CSRF 校验在后端完成）
    location /api/ {
        limit_req zone=lab_api burst=100 nodelay;
        limit_conn lab_conn 200;
        proxy_pass http://labspace_backend;
        proxy_buffering off;
    }

    # ── PDF 工具箱（Stirling PDF）的同源代理 ──
    # 为什么要有这一段（而不是前端直接调 :8106）：
    #   浏览器里 **端口不同就是不同源**。前端从 :80 调 :8106 是跨域请求，
    #   而 Stirling 的 CORS 允许来源留空时回退到 `*` —— 带 Cookie 的
    #   `Access-Control-Allow-Origin: *` 会被浏览器判为非法，响应直接被拦。
    #   走同源的 /pdf-api/ 就没这个问题，而且鉴权也顺势收口到一处。
    location = /_portal_auth {
        internal;
        proxy_pass http://labspace_backend/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    # ── Mailbox（收信服务）的同源代理 ──
    # 门户前端自绘读信界面，直接调 /mail/v1/...：同源就免了 CORS，
    # 也顺势把鉴权收口在门户会话层（服务自己的 token 用于脚本/助手）。
    location ^~ /mail/ {
        auth_request /_portal_auth;
        error_page 401 = @portal_login;
        proxy_pass http://127.0.0.1:8117/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /mail;
        proxy_buffering off;
        client_max_body_size 64m;
    }

    # ── WebSSH 的同源代理 ──
    # 为什么要代理而不让前端直连 :8105：
    #   1. 端口不同即跨源。WebSSH 的登录是**表单 POST**（set-cookie），
    #      跨源 POST + Set-Cookie 在浏览器侧直接被拦，用户永远登不进去。
    #   2. socket.io 的握手与 polling 回退也需要同源才能带上会话。
    #   3. 门户的 auth_request 已经核对过一次会话，这里不重复（WebSSH 自己有账号）。
    #
    # Cookie 天然按 host 作用域（不区分端口），所以同源代理之后
    # WebSSH 的会话 Cookie 与门户 Cookie 共存于 198.51.100.71 上，互不干扰。
    # 受保护的同源代理（ssh-app / pdf-api …）未登录时回登录页，登录后回到原位置。
    location @portal_login {
        return 302 /api/auth/login?back=$request_uri;
    }

    location ^~ /ssh-app/ {
        # 门户会话是**第一道门**：没登录门户的人连 WebSSH 的登录页都看不到，
        # 否则 LAN 上任何人都能摸到它的注册页自己开号。
        auth_request /_portal_auth;
        error_page 401 = @portal_login;
        proxy_pass http://127.0.0.1:8115/;
        # 子路径部署：WebSSH 按 APPLICATION_ROOT + 这个头把模板里的
        # 绝对路径（form action、静态资源、redirect）自己加上 /ssh-app 前缀。
        #
        # 注意**不要**再加 proxy_redirect / /ssh-app/ —— 那会和它自己的前缀
        # 叠加，变成 /ssh-app/ssh-app/login（实测踩过）。
        proxy_set_header X-Forwarded-Prefix /ssh-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 512m;
    }

    # socket.io：WebSSH 的前端默认走 /socket.io/，同源代理要保留这个前缀
    # （socket.io 客户端用 path 参数指定，见前端 socketPath）。
    location /ssh-io/ {
        proxy_pass http://127.0.0.1:8115/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # WebSSH 的就绪探针（同源）。
    # 浏览器里端口不同即跨源：前端从 :80 直接调 :8105/ready 会被 CORS 拦掉，
    # 页面上就会误报「服务不可达」。走同源代理就没有这个问题。
    # 这个探针只回 ready 状态、不含任何业务信息，因此不挂 auth_request。
    location = /webssh-ready/ {
        proxy_pass http://127.0.0.1:8115/ready;
        proxy_set_header Host $host;
        access_log off;
    }

    location ^~ /pdf-api/ {
        # 门户会话鉴权：和 primer / webssh / stirling 同一套口径
        auth_request /_portal_auth;
        # /pdf-api/general/merge-pdfs → Stirling 的 /api/v1/general/merge-pdfs
        #
        # 用显式 rewrite 而不是 proxy_pass 带 URI：
        # proxy_pass 的 URI 替换依赖「匹配到的 location 前缀」，
        # 在 ^~ 前缀 + auth_request 的组合下实测没有按预期替换
        # （Stirling 收到的是 /general/merge-pdfs，少了一层 /api/v1）。
        # rewrite 明确把路径改写掉，不依赖前缀替换的细节。
        rewrite ^/pdf-api/(.*)$ /api/v1/$1 break;
        proxy_pass http://127.0.0.1:8116;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # 转换任务可能跑一两分钟
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 256m;
    }

    # Go 核心（LabGo）：会话 Cookie + CSRF 由 Go 服务自己校验，Python 网关不在链路上
    location /api/next/ {
        proxy_pass http://labgo/;
        proxy_buffering off;
        # 必须透传原始 Host，服务目录按访问入口自适应主机
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Labgo-Origin-Host $host;
    }

    # CropGenome Toolkit：由 Go 核心作为 OIDC 感知反向代理转发。
    # 核心校验门户会话并注入 X-OIDC-* 头，工具服务本身不接触浏览器 Cookie，
    # 也不接受客户端自带的身份头。
    # CropGenome Toolkit：API 走 Go 核心（→ cropgenome Go 服务 → Rust-Bio worker），
    # 前端是独立 SPA，静态产物托管在 /srv/labdata/cropgenome/web。
    # 两段必须分开：/cropgenome/api/ 是 API，其余路径是前端静态文件。
    location /cropgenome/api/ {
        proxy_pass http://labgo/cropgenome/api/;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /cropgenome/ {
        include /opt/labspace/deploy/nginx/lab-security-headers.conf;
        alias /srv/labdata/cropgenome/web/;
        index index.html;
        # SPA history fallback：前端是 react-router，刷新子路由不能 404
        try_files $uri $uri/ /cropgenome/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /cropgenome/assets/ {
        include /opt/labspace/deploy/nginx/lab-security-headers.conf;
        alias /srv/labdata/cropgenome/web/assets/;
        # 产物带内容哈希，缓存可以长期不变；只留一条 Cache-Control，
        # expires 会另加一条 max-age，两条并存时以先出现的那条为准，容易误判。
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # 服务目录 / 健康检查 / 内嵌探测 / 一键登录入口：已由 Go 核心接管
    # （替换原 Python catalog.py + embed.py 的实现，Python 侧仅保留兼容路由）
    # Go 核心异常时自动切换到 Python 兼顶（两者路径与响应结构一致）
    location = /api/services {
        proxy_pass http://labgo_fallback/v1/services;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }
    location /api/services/ {
        proxy_pass http://labgo_fallback/v1/services/;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 统一语料 / 全局搜索：已由 Go 核心接管（替换原 Python corpus.py 的实现）
    # Python 侧保留兼容路由，仅在 Go 核心不可达时回退。
    location = /api/corpus {
        proxy_pass http://labgo_fallback/v1/corpus;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }
    location = /api/search {
        proxy_pass http://labgo_fallback/v1/portal/search;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }
    location = /api/search/suggest {
        proxy_pass http://labgo_fallback/v1/corpus/suggest;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }
    location = /api/search/categories {
        proxy_pass http://labgo_fallback/v1/portal/search/categories;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 收藏 / 最近访问：已由 Go 核心接管（Python 侧保留 /v1/* 兼容路由作兼顶）
    location = /api/favorites {
        proxy_pass http://labgo_fallback/v1/favorites;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }
    location /api/favorites/ {
        proxy_pass http://labgo_fallback/v1/favorites/;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }
    location = /api/recent {
        proxy_pass http://labgo_fallback/v1/recent;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }
    location /api/recent/ {
        proxy_pass http://labgo_fallback/v1/recent/;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 原生文件管理：由 Go 核心按 Quantum 作用域重新鉴权后只读输出
    location = /api/files {
        proxy_pass http://labgo_fallback/v1/files;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }
    location /api/files/ {
        proxy_pass http://labgo_fallback/v1/files/;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ---- 旧路径入口：统一 302 到「当前入口主机 + 端口」新地址 ----
    # 使用 $host 动态跟随访问入口（192.0.2.10 / Tailscale），避免跨网段跳转失效
    location = /draw/   { return 302 $scheme://$host:8082/; }
    location = /commands/ { return 302 $scheme://$host:8086/; }
    location = /jbrowse/ { return 302 $scheme://$host:8091/index.html?config=data/demo/config.zh.json; }

    # 门户同源内嵌 JBrowse（动态 FASTA 装配）：静态应用走 8091，
    # /genome-api 转发到后端生成 config/.fai 并流式读取原始序列。
    # 两者必须同源，否则 JBrowse 里的 IndexedFastaAdapter 无法携带门户会话。
    location /jbrowse/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
    location /genome-api/ {
        proxy_pass http://127.0.0.1:8088/api/genomes/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    # 前端路由回退（SPA）：入口 HTML 不缓存，避免升级后仍加载旧资源清单
    location / {
        include /opt/labspace/deploy/nginx/lab-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

# =====================================================================
#  Casdoor —— 统一身份源（IP 专属端口：192.0.2.10:8090）
#  单独端口的原因：Casdoor 前端使用根路径 /api/* 调用，与门户同端口会冲突；
#  独立端口后授权地址、token 端点、issuer 全部为 IP，客户端无需解析域名。
# =====================================================================
server {
    listen      8090;
    listen      [::]:8090;
    server_name _;

    include /opt/labspace/deploy/nginx/lab-security-headers.conf;

    # 登录相关路径单独限流（防口令暴力破解）。
    # 必须用 $ 结尾：否则 /login/oauth/authorize 这类 OIDC 授权端点也会被匹配，
    # 一键登录连开多个服务时会被误伤。Casdoor 的口令校验走 POST /api/get-account
    # （checkPassword=true），所以该端点也要限流。
    location ~ ^/(login|signup|api/login|api/signup|api/get-account)$ {
        limit_req zone=lab_login burst=10 nodelay;
        limit_conn lab_conn 20;
        proxy_pass http://lab_casdoor;
        # 保留端口，Casdoor 据此生成 http://192.0.2.10:8090 的授权地址
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://lab_casdoor;
        # 保留端口，Casdoor 据此生成 http://192.0.2.10:8090 的授权地址
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}


# =====================================================================
#  Linux Command —— 192.0.2.10:8086（官方静态站点，离线可用）
# =====================================================================
server {
    listen      8086;
    listen      [::]:8086;
    server_name _;

    root /opt/labspace/frontend/linux-command/dist;
    index index.html;

    include /opt/labspace/deploy/nginx/lab-security-headers.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# =====================================================================
#  JBrowse 2 —— 192.0.2.10:8091（静态应用 + 数据目录）
# =====================================================================
server {
    listen      8091;
    listen      [::]:8091;
    server_name _;

    root /srv/labdata/jbrowse/web;
    index index.html;

    include /opt/labspace/deploy/nginx/lab-security-headers.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
    # 数据目录（示例 BAM/VCF/参考序列）
    location /data/ {
        include /opt/labspace/deploy/nginx/lab-security-headers.conf;
        alias /srv/labdata/jbrowse/web/data/;
        autoindex off;
        add_header Cache-Control "no-cache" always;
    }
    # 文件管理里的 FASTA → JBrowse 动态装配。
    # 8091 与门户同主机，Cookie 按主机而非端口隔离，因此这里的请求
    # 仍带用户会话；后端再经 Go 文件核心按 ACL 判权，不额外放行。
    location /genome-api/ {
        proxy_pass http://127.0.0.1:8088/api/genomes/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }
}

# =====================================================================
#  图纸平台 —— 192.0.2.10:8093（反向代理到 192.0.2.29:5244）
#  独立主机只能从内网直连；经此代理后内网与 Tailscale 两个入口均可访问。
# =====================================================================
server {
    listen      8093;
    listen      [::]:8093;
    server_name _;

    include /opt/labspace/deploy/nginx/lab-security-headers.conf;

    location / {
        proxy_pass http://192.0.2.29:5244;
        proxy_http_version 1.1;

        # 保留访问方 Host，图纸平台生成的绝对链接才会落在当前入口
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # 上游若仍返回自身内网地址，改写为同源相对路径，避免跳出 8093 入口
        proxy_redirect http://192.0.2.29:5244/ /;
        proxy_redirect https://192.0.2.29:5244/ /;

        # 在线预览 / 大文件下载直通，不落盘缓冲
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 512m;
    }
}

# =====================================================================
#  Baserow —— 192.0.2.10:8094（反向代理到 127.0.0.1:8096）
#  容器仅监听回环；本入口同时覆盖内网与 Tailscale，实现双 IP 访问。
# =====================================================================
server {
    listen      8094;
    listen      [::]:8094;
    server_name _;

    include /opt/labspace/deploy/nginx/lab-security-headers.conf;

    location / {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        # 保留原始 Host，Baserow 依据 ALLOWED_HOSTS 校验双 IP 入口
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 256m;
    }
}

# =====================================================================
#  LabSpace 内网入口（全部为 192.0.2.10 + 端口，不使用任何域名）
#
#    :80    门户            http://192.0.2.10/
#    :8092  文件工坊        http://192.0.2.10:8092/
#    应用同源路径：/apps/commands/、/jbrowse/、/apps/bioinfo/、/apps/primer/
#    8086/8091/8102 仅回环，供门户 Nginx 反代，不直接暴露。
# =====================================================================

# WebSocket / SSE 升级
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 大文件上传（课程资料与生信数据）
client_max_body_size 10G;

# ---------------------------------------------------------------- 限流（内网基础防护）
# 说明：zone 只是定义，必须在 location 里用 limit_req 才会真正生效。
# 之前只定义了 zone 却没挂 limit_req，等于没有限流；现在按用途分别挂载。
limit_req_zone $binary_remote_addr zone=lab_api:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=lab_conn:10m;
# PDF 工具箱每次请求都要起 LibreOffice/JVM 转换，10r/m 都算宽了；
# 挂在这里而不是 server 级，是因为它和普通 API 的成本完全不同量级。
limit_req_zone $binary_remote_addr zone=lab_pdf:10m rate=10r/m;
# 收信服务：读信高频但很轻，给一档独立额度，避免和 PDF 抢同一个桶。
limit_req_zone $binary_remote_addr zone=lab_mail:10m rate=30r/s;

upstream labspace_backend   { server 127.0.0.1:8088; keepalive 16; }
upstream labgo              { server 127.0.0.1:8122; keepalive 8; }
# 服务目录 / 语料 / 搜索：Go 核心为主，Python 后端作为 backup 兼顶
# （Python 侧同时提供 /v1/* 同路径别名，见 backend/app/main.py）
# labgo 为主、Python 后端为 backup。
# 原 max_fails=1 fail_timeout=10s 太脆：一次瞬时连接失败就把 labgo 标记 down，
# 10 秒内所有请求落到 Python —— 而 Python 没有 /api/files 路由，于是 404
# （表现为「文件列表空白 + JBrowse 报 JSON 解析错误」）。
# 现在失败阈值放宽、恢复更快，且 backup 只在 labgo 真的连续失败时才启用。
upstream labgo_fallback     { server 127.0.0.1:8122 max_fails=3 fail_timeout=3s; server 127.0.0.1:8088 backup; }

# ---------------------------------------------------------------- 通用反代参数
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

# =====================================================================
#  门户（默认站点：未匹配到主机名时也进入门户，方便用 IP 直连）
# =====================================================================
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    root /opt/labspace/frontend/dist;
    index index.html;

    # 连接数上限提到 server 级：挂在 location /api/ 里只覆盖一条前缀，
    # 而占流量大头的是 /api/files/、/api/next/、/api/search，它们各自是独立
    # location，之前等于完全不限并发。
    limit_conn lab_conn 200;

    # 静态文件元数据缓存，减少高频访问时的 stat/open 开销
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 前端入口 HTML 不缓存（发布后立即生效）
    location = /index.html {
        include /opt/labspace/deploy/nginx/lab-security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    # 前端静态资源（文件名带 hash，可长期缓存；避免与 expires 叠加出两条头）
    location /assets/ {
        include /opt/labspace/deploy/nginx/lab-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # 后端 API（CSRF 校验在后端完成）
    location /api/ {
        limit_req zone=lab_api burst=100 nodelay;
        proxy_pass http://labspace_backend;
        proxy_buffering off;
    }

    # ── PDF 工具箱（Stirling PDF）的同源代理 ──
    # 为什么要有这一段（而不是前端直接调 :8116）：
    #   浏览器里 **端口不同就是不同源**。前端从 :80 调 :8116 是跨域请求，
    #   而 Stirling 的 CORS 允许来源留空时回退到 `*` —— 带 Cookie 的
    #   `Access-Control-Allow-Origin: *` 会被浏览器判为非法，响应直接被拦。
    #   走同源的 /pdf-api/ 就没这个问题，而且鉴权也顺势收口到一处。
    location = /_portal_auth {
        internal;
        proxy_pass http://labspace_backend/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # 子请求是 /pdf-api/、/mail/、primer 这些直连服务的唯一鉴权关口，
        # 因此必须把「原始方法」与「CSRF 头」一起带过去：
        #   * 只有方法才知道这次是读还是写（GET 不该要求 CSRF）；
        #   * 只有原始 URI 才知道是否属于改密豁免路径。
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_set_header Cookie $http_cookie;
    }

    # ── Mailbox（收信服务）的同源代理 ──
    # 门户前端自绘读信界面，直接调 /mail/v1/...：同源就免了 CORS，
    # 也顺势把鉴权收口在门户会话层（服务自己的 token 用于脚本/助手）。
    location ^~ /mail/ {
        auth_request /_portal_auth;
        limit_req zone=lab_mail burst=60 nodelay;
        error_page 401 = @portal_login;
        proxy_pass http://127.0.0.1:8117/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /mail;
        # 上游若回绝对地址（Location 或页面里的跳转链接），改回「当前访问的入口」：
        # 内网进来还给内网 IP，Tailscale 进来还给 Tailscale IP，不会跨网段。
        proxy_redirect ~^https?://[^/]+(/mail/.*)$ $scheme://$host$1;
        proxy_redirect ~^https?://[^/]+(/.*)$ $scheme://$host/mail$1;
        proxy_buffering off;
        client_max_body_size 64m;
    }

        location @portal_login {
        return 302 /api/auth/login?back=$request_uri;
    }

    location ^~ /pdf-api/ {
        # 门户会话鉴权：和 primer / stirling 同一套口径
        auth_request /_portal_auth;
        # 转换是最重的请求（起 JVM/LibreOffice、几百 MB 中间文件），
        # 必须单独一档：否则一个人点十次就能把整机 CPU 吃满。
        limit_req zone=lab_pdf burst=5 nodelay;
        limit_req_status 503;
        # /pdf-api/general/merge-pdfs → Stirling 的 /api/v1/general/merge-pdfs
        #
        # 用显式 rewrite 而不是 proxy_pass 带 URI：
        # proxy_pass 的 URI 替换依赖「匹配到的 location 前缀」，
        # 在 ^~ 前缀 + auth_request 的组合下实测没有按预期替换
        # （Stirling 收到的是 /general/merge-pdfs，少了一层 /api/v1）。
        # rewrite 明确把路径改写掉，不依赖前缀替换的细节。
        rewrite ^/pdf-api/(.*)$ /api/v1/$1 break;
        proxy_pass http://127.0.0.1:8116;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # 转换任务可能跑一两分钟
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 256m;
    }

    # 生信实训平台：挂在门户同源 /apps/bioinfo/ 下（去掉前缀后转给它自己的
    # nginx，由它再按 /api/ 与 /ws/ 分流；WebSocket 需要 Upgrade 头透传）。
    location /apps/bioinfo/ {
        proxy_pass http://127.0.0.1:8102/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 终端是长连接（WebSocket + 流式输出），读超时必须放开
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Primer3 同源入口：门户会话鉴权后转发到 Apptainer 内的 FastAPI。
    # 前端构建 base=/apps/primer/，API 客户端也使用该前缀。
    location ^~ /apps/primer/ {
        auth_request /_portal_auth;
        error_page 401 = @portal_login;
        proxy_pass http://127.0.0.1:18097/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 512m;
    }

    # 门户自建 OIDC Provider（替代 Casdoor）：给生信实训平台等内网服务做登录。
    # 路径对外是 /oidc/*，内部是 labgo 的 /v1/oidc/*。
    location /oidc/ {
        proxy_pass http://labgo/v1/oidc/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Go 核心（LabGo）：会话 Cookie + CSRF 由 Go 服务自己校验，Python 网关不在链路上
    location /api/next/ {
        proxy_pass http://labgo/;
        proxy_buffering off;
        # 必须透传原始 Host，服务目录按访问入口自适应主机
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Labgo-Origin-Host $host;
    }

    # CropGenome 已下架（2026-11），序列分析改由门户 /bio-tools 页面调用后端 /api/biotools/*。
    # 旧的三段 location（/cropgenome/api/、/cropgenome/、/cropgenome/assets/）随服务一起删除，
    # 不做 302 重定向：旧书签不应该被悄悄带到新页面。

    # 服务目录 / 健康检查 / 内嵌探测 / 一键登录入口：已由 Go 核心接管
    # （替换原 Python catalog.py + embed.py 的实现，Python 侧仅保留兼容路由）
    # Go 核心异常时自动切换到 Python 兼顶（两者路径与响应结构一致）
    location = /api/services {
        proxy_pass http://labgo_fallback/v1/services;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }
    location /api/services/ {
        proxy_pass http://labgo_fallback/v1/services/;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 统一语料 / 全局搜索：已由 Go 核心接管（替换原 Python corpus.py 的实现）
    # Python 侧保留兼容路由，仅在 Go 核心不可达时回退。
    location = /api/corpus {
        proxy_pass http://labgo_fallback/v1/corpus;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }
    location = /api/search {
        proxy_pass http://labgo_fallback/v1/portal/search;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }
    location = /api/search/suggest {
        proxy_pass http://labgo_fallback/v1/corpus/suggest;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }
    location = /api/search/categories {
        proxy_pass http://labgo_fallback/v1/portal/search/categories;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 收藏 / 最近访问：已由 Go 核心接管（Python 侧保留 /v1/* 兼容路由作兼顶）
    location = /api/favorites {
        proxy_pass http://labgo_fallback/v1/favorites;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }
    location /api/favorites/ {
        proxy_pass http://labgo_fallback/v1/favorites/;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }
    location = /api/recent {
        proxy_pass http://labgo_fallback/v1/recent;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }
    location /api/recent/ {
        proxy_pass http://labgo_fallback/v1/recent/;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 原生文件管理：由 Go 核心按来源作用域重新鉴权后只读输出
    location = /api/files {
        proxy_pass http://labgo_fallback/v1/files;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }
    location /api/files/ {
        proxy_pass http://labgo_fallback/v1/files/;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ---- 旧路径别名：一律 302 到门户同源新路径（不再跳 IP+端口直连） ----
    location = /draw/   { return 302 /apps/drawio/; }
    location = /commands/ { return 302 /apps/commands/; }
    # 裸 /jbrowse/（旧书签 / Genomes 默认）：同源 302 到内置 demo 配置。
    # 不带 config 打开会让 JBrowse 拉不存在的 config.json（404 HTML）。
    location = /jbrowse/ { return 302 /jbrowse/index.html?config=data/demo/config.zh.json; }

    # ---- 裸应用统一走 /apps/ 同源反代（浏览器只看到门户一个入口） ----
    # 注意：/drawio、/commands 等无 /apps/ 前缀的路径是门户 React 路由，
    # 裸应用必须挂在 /apps/ 下避免遮蔽 SPA 路由。
    # draw.io 静态资源为相对路径引用，可直接挂子路径；postMessage 走同源免跨域。
    location /apps/drawio/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
    # Linux 命令速查（静态站，相对路径引用）
    location /apps/commands/ {
        proxy_pass http://127.0.0.1:8086/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 门户同源内嵌 JBrowse（动态 FASTA 装配）：静态应用走 8091，
    # /genome-api 转发到后端生成 config/.fai 并流式读取原始序列。
    # 两者必须同源，否则 JBrowse 里的 IndexedFastaAdapter 无法携带门户会话。
    location /jbrowse/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
    location /genome-api/ {
        proxy_pass http://127.0.0.1:8088/api/genomes/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    # 前端路由回退（SPA）：入口 HTML 不缓存，避免升级后仍加载旧资源清单
    location / {
        include /opt/labspace/deploy/nginx/lab-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

# =====================================================================
#  Linux Command —— 回环静态站，门户通过 /apps/commands/ 同源反代
# =====================================================================
server {
    listen      127.0.0.1:8086;
    server_name _;

    root /opt/labspace/frontend/linux-command/dist;
    index index.html;

    include /opt/labspace/deploy/nginx/lab-security-headers.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# =====================================================================
#  JBrowse 2 —— 回环静态站，门户通过 /jbrowse/ 同源反代
# =====================================================================
server {
    listen      127.0.0.1:8091;
    server_name _;

    root /srv/labdata/jbrowse/web;
    index index.html;

    include /opt/labspace/deploy/nginx/lab-security-headers.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location /data/ {
        include /opt/labspace/deploy/nginx/lab-security-headers.conf;
        alias /srv/labdata/jbrowse/web/data/;
        autoindex off;
        add_header Cache-Control "no-cache" always;
    }
}

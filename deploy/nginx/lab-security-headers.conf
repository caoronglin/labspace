# =====================================================================
#  LabSpace 通用安全响应头
#
#  nginx 语义：只要 location 里出现自己的 add_header，server 级的 add_header
#  就会被**整体替换**（不是合并）。因此每个自带 add_header 的 location
#  都必须 include 这个片段，否则会丢掉 nosniff / X-Frame-Options 等头。
# =====================================================================
add_header X-Content-Type-Options "nosniff" always;
# 允许门户（两个入口的任意端口）嵌入本服务；不再使用 X-Frame-Options SAMEORIGIN
# （SAMEORIGIN 会按端口隔离，导致门户 iframe 打开 8086/8091 等独立端口时空白）。
add_header Content-Security-Policy "frame-ancestors 'self' http://192.0.2.10:* http://198.51.100.71:*" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

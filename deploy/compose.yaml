name: labspace

services:
  # ---------------------------------------------------------------- LabSpace 后端
  backend:
    build: ../backend
    image: lab/labspace-backend:1.0.0
    container_name: lab-labspace-backend
    restart: unless-stopped
    init: true
    # 与 Quantum 使用同一服务账号 uid 1000：
    # 复用既有的 ACL（u:1000:rwX），从而能在用户个人目录内受控写入
    user: "1000:1000"
    env_file:
      - ./.env
    environment:
      TZ: Asia/Shanghai
      LABSPACE_DB_DSN: "postgresql://labspace:labspace-local-dev-pw@lab-postgres:5432/labspace"
    volumes:
      # 受控保存个人绘图：只挂载用户目录根，后端再做路径与内容校验
      - /srv/lab/users:/srv/lab/users
      # PDF 翻译任务队列（与 pdf2zh 工作进程共享）
      - /srv/labdata/translate:/srv/labdata/translate:rw
      # Linux 命令官方库（只读，两个独立挂载点，避免只读目录下再挂载）
      - /opt/labspace/frontend/linux-command/src/dist/data.json:/opt/labspace/cmd-index.json:ro
      - /opt/labspace/frontend/linux-command/src/command:/opt/labspace/cmd:ro
      # Go 核心（LabGo）导出的服务目录：唯一权威源，只读挂载
      - /srv/labdata/labgo:/srv/labgo:ro
      # Baserow 管理员凭据（640 root:1000，仅后端服务账号可读）
      - /etc/labspace/baserow-admin.txt:/etc/labspace/baserow-admin.txt:ro
      # LabOps：流水线任务目录与宿主机 worker 共享；参考基因组/演示数据只读
      - /srv/labdata/labops:/srv/labdata/labops:rw
      - /srv/labdata/bioinfo-training/shared/reference:/srv/labops/shared/reference:ro
      - /srv/labdata/bioinfo-training/shared/raw:/srv/labops/shared/raw:ro
      # LaTeX 写作：编译产物 PDF 与源文件日志
      - /srv/labdata/latex:/srv/labdata/latex:rw
    ports:
      # 仅回环，统一由宿主机 Nginx 内网入口对外
      - "127.0.0.1:8088:8080"
    networks:
      - labspace
      # 接入既有 lab-tools 网络，按容器名探测其它组件健康状态
      - lab-tools
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------- LaTeX 编译 sidecar
  # 与门户同一镜像（含 texlive），但只运行 latex_worker：不挂载任何门户数据卷、
  # 根文件系统只读、仅 tmpfs 可写，xelatex 加 -no-shell-escape。
  latex-compile:
    build: ../backend
    image: lab/labspace-backend:1.0.0
    container_name: lab-latex-compile
    restart: unless-stopped
    init: true
    user: "1000:1000"
    command: ["python", "-m", "app.latex_worker"]
    environment:
      TZ: Asia/Shanghai
      HOME: "/tmp"
      LATEX_WORKER_PORT: "8131"
      LATEX_COMPILE_TIMEOUT: "60"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks:
      - labspace
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8131/health',timeout=4)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------- Casdoor（统一身份源）
  casdoor:
    image: casbin/casdoor:latest
    container_name: lab-casdoor
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Shanghai
      RUNNING_IN_DOCKER: "true"
      ENABLE_LOGIN_FORM: "true"
      # Casdoor 通过同名环境变量覆盖 beego app.conf（官方方式）
      driverName: "postgres"
      dataSourceName: "user=casdoor password=casdoor-local-dev-pw host=lab-postgres port=5432 dbname=casdoor sslmode=disable"
      dbName: "casdoor"
      # 内置管理员初始口令（仅在首次启动、admin 口令未设置时生效）
      initAdminPassword: "Cas-cc7da6dfa4e235f93fe2"
      runmode: "prod"
      defaultLanguage: "zh"
      forceLanguage: "zh"
      staticBaseUrl: "https://cdn.casbin.org"
      # origin 留空：Casdoor 按请求的 Host 回显 issuer，
      # 因此门户可按访问主机（LAN IP / Tailscale IP / 别名域名）动态选择 issuer，
      # 授权地址始终与浏览器实际访问的主机一致，无需 DNS 解析
      origin: ""
      originFrontend: ""
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - labspace
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------- draw.io
  drawio:
    image: jgraph/drawio:latest
    container_name: lab-drawio
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Shanghai
      DRAWIO_BASE_URL: "/"
      DRAWIO_HOST: "0.0.0.0"
      DRAWIO_PORT: "8080"
      DRAWIO_CONFIG_PATH: "/usr/local/app/config.json"
      DRAWIO_TELEMETRY: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - drawio-config:/usr/local/app/config.json
    ports:
      # 0.0.0.0：以便 Tailscale (198.51.100.71) 与内网 IP 都能直连；
      # 访问控制由 nftables 负责（仅放行内网 192.0.2.0/24 与 Tailscale 100.64.0.0/10）
      - "8082:8080"
    networks:
      - labspace
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # ---------------------------------------------------------------- PDF 翻译
  pdf2zh:
    image: awwaawwa/pdfmathtranslate-next:latest
    container_name: lab-pdf2zh
    restart: unless-stopped
    init: true
    command: ["/bin/sh", "/opt/labspace/pdf2zh-worker.sh"]
    environment:
      TZ: Asia/Shanghai
      PDF2ZH_SERVICES: "${PDF2ZH_SERVICES:-openaicompatible}"
      PDF2ZH_LANG_IN: "${PDF2ZH_LANG_IN:-en}"
      PDF2ZH_LANG_OUT: "${PDF2ZH_LANG_OUT:-zh}"
      PDF2ZH_MT_BASE: "http://backend:8080/internal/mt/v1"
      PDF2ZH_MT_MODEL: "hy-mt2"
      LABSPACE_INTERNAL_MT_TOKEN: "${LABSPACE_INTERNAL_MT_TOKEN:-}"
      # 离线字体与模型缓存（持久化，避免每次重启重新下载）
      HF_HOME: "/models/hf"
      TORCH_HOME: "/models/torch"
    volumes:
      - /srv/labdata/translate:/jobs
      - /srv/labdata/translate-models:/models
      - ./pdf2zh-worker.sh:/opt/labspace/pdf2zh-worker.sh:ro
    networks:
      - labspace
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "test -f /jobs/worker.heartbeat && [ $(( $(date +%s) - $(cat /jobs/worker.heartbeat) )) -lt 60 ]"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    tmpfs:
      - /tmp:size=1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ---------------------------------------------------------------- Baserow（低代码数据库）
  # 官方 all-in-one 镜像：内置 PostgreSQL / Redis / Caddy / Celery。
  # 容器只绑定回环，统一由宿主机 Nginx 8094 端口对内网与 Tailscale 提供入口。
  baserow:
    image: baserow/baserow:2.4.1
    container_name: lab-baserow
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Shanghai
      # 规范化入口；Tailscale 访问时前端使用相对路径，仅邀请链接等绝对地址指向该值
      BASEROW_PUBLIC_URL: "http://192.0.2.10:8094"
      # 双 IP 入口均需通过 Django ALLOWED_HOSTS 与前端站点解析校验
      BASEROW_EXTRA_ALLOWED_HOSTS: "192.0.2.10,198.51.100.71,localhost,127.0.0.1"
      BASEROW_EXTRA_PUBLIC_URLS: "http://192.0.2.10:8094,http://198.51.100.71:8094"
      # 外层 Nginx 已终止 HTTP；内层 Caddy 只监听 80，避免自动申请证书
      BASEROW_CADDY_ADDRESSES: ":80"
    volumes:
      - /srv/labdata/baserow:/baserow/data
    ports:
      # 仅回环，统一由宿主机 Nginx 内网入口对外
      - "127.0.0.1:8096:80"
    networks:
      - labspace
    cap_drop:
      - ALL
    cap_add:
      # all-in-one 内需要启动 postgres/redis 并以非 root 运行各进程
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - KILL
    security_opt:
      - no-new-privileges:true
    shm_size: 512m
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 1024
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/_health/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  drawio-config:

networks:
  labspace:
    name: labspace-net        # 固定网络名，便于把既有 PostgreSQL 容器接入
    driver: bridge
  lab-tools:
    external: true           # 既有组件所在网络（SearXNG / Tika / Docling / 文件服务等）

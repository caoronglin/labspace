# Apptainer 服务清单：`名称 镜像:标签`
#
# 只列**单进程、无容器间依赖、状态在宿主机目录**的服务。
# 需要 bridge 网络/DNS 别名或复杂编排的（postgres、baserow、
# backend、agentscope）继续走 Docker Compose，原因见 docs/APPTAINER.md。
# primer 的源码在 /opt/primer（独立仓库 cnb.cool/crl-code/primer），
# 镜像由它自己的 Dockerfile 构建：cd /opt/primer && docker build -t primer-workbench:3.9.3 .
# 不要再从 /tmp 构建——/tmp 会被清理，构出来的镜像就再也复现不了。
primer   primer-workbench:3.9.3
tika     apache/tika:3.2.3.0-full
drawio   jgraph/drawio:latest
docling  ghcr.io/docling-project/docling-serve:latest
